[project]
name = "quant-cliff"
version = "0.1.0"
description = "At what bit-width does a quantized LLM stop working? Seven quantization levels of open models on maths, multiple choice and extraction, measured locally."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kameswara Sai Srikar Manda" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.scripts]
qcliff = "qcliff.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcliff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
